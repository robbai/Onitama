fail_fast: false

default_language_version:
  python: python3

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.0.1
  hooks:
  - id: check-added-large-files
    args: [--maxkb=8192]
  - id: check-merge-conflict
  - id: check-yaml
  - id: end-of-file-fixer
  - id: mixed-line-ending
  - id: requirements-txt-fixer
  - id: sort-simple-yaml
  - id: trailing-whitespace

- repo: https://gitlab.com/daverona/pre-commit/cpp
  rev: 0.8.0
  hooks:
  - id: clang-format
    args: [-style=file]
  - id: cpplint
    args: ['--filter=-build/c++11, -legal/copyright, -build/include_subdir, -build/header_guard, -whitespace/line_length, -runtime/references, -runtime/string, -whitespace/braces, -runtime/arrays,']

- repo: https://github.com/ambv/black
  rev: 21.6b0
  hooks:
  - id: black

- repo: https://gitlab.com/pycqa/flake8
  rev: 3.9.2
  hooks:
  - id: flake8

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.1.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix]

- repo: https://github.com/pycqa/isort
  rev: 5.9.2
  hooks:
  - id: isort
    args: [--profile, black, --filter-files, --length-sort]
